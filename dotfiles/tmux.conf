#set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"
#set -g mouse on
#set-option -g status-interval 5

# fix image previews
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# source "/usr/share/powerline/bindings/tmux/powerline.conf"

# change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g @continuum-restore 'on'
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @catppuccin_date_time '%Y-%m-%d %H:%M'
# set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'malanius/tmux-spotify-linux#main' # my own is D-Bus based, not for Mac App
set -g @plugin 'xamut/tmux-spotify' # Mac one, but not as fancy as mine
# set -g @plugin 'erikw/tmux-powerline'

set-option -g automatic-rename on
# set-option -g automatic-rename-format '#{b:pane_current_path/*}'
# set-option -g automatic-rename-format '#{b:pane_current_path}'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# split pane to current pane dir
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# run-shell '/home/malanius/projects/tmux-spotify-linux/tmux-spotify.tmux'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
